<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050913"/>
      <stop offset="50%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#080E1C"/>
    </linearGradient>

    <!-- Center Node Gradient -->
    <linearGradient id="centerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#142850"/>
      <stop offset="50%" stop-color="#0E1B38"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>

    <!-- Branch Gradients -->
    <linearGradient id="cyanNodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E243D"/>
      <stop offset="100%" stop-color="#091424"/>
    </linearGradient>

    <linearGradient id="amberNodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D1C08"/>
      <stop offset="100%" stop-color="#140C04"/>
    </linearGradient>

    <linearGradient id="blueNodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E2845"/>
      <stop offset="100%" stop-color="#081729"/>
    </linearGradient>

    <linearGradient id="greenNodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B2B22"/>
      <stop offset="100%" stop-color="#061A14"/>
    </linearGradient>

    <linearGradient id="purpleNodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F153B"/>
      <stop offset="100%" stop-color="#110B22"/>
    </linearGradient>

    <!-- Glow & Shadow Filters -->
    <filter id="shadow8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="centerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#00E5FF" flood-opacity="0.35"/>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid8" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.8" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <style>
    .font-sans { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'SF Mono', Consolas, 'Liberation Mono', Menlo, monospace; }
  </style>

  <!-- Background Layer -->
  <rect width="1920" height="1080" fill="url(#bgGrad8)"/>
  <rect width="1920" height="1080" fill="url(#grid8)"/>

  <!-- Subtle ambient glow halos -->
  <circle cx="960" cy="540" r="320" fill="#00E5FF" opacity="0.04" filter="blur(60px)"/>
  <circle cx="380" cy="340" r="260" fill="#38BDF8" opacity="0.03" filter="blur(50px)"/>
  <circle cx="1540" cy="340" r="260" fill="#00E5FF" opacity="0.03" filter="blur(50px)"/>
  <circle cx="380" cy="740" r="260" fill="#10B981" opacity="0.03" filter="blur(50px)"/>
  <circle cx="1540" cy="740" r="260" fill="#8B5CF6" opacity="0.03" filter="blur(50px)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(80, 45)">
    <!-- Pill -->
    <rect x="0" y="0" width="430" height="28" rx="14" fill="#1E293B" fill-opacity="0.8" stroke="#334155" stroke-width="1"/>
    <circle cx="14" cy="14" r="5" fill="#00E5FF"/>
    <text x="28" y="19" class="font-mono" font-size="11" font-weight="700" fill="#00E5FF" letter-spacing="1.5">STRATEGIC VALUE PROPOSITION &amp; IMPACT</text>

    <!-- Title & Subtitle -->
    <text x="0" y="68" class="font-sans" font-size="34" font-weight="800" fill="#FFFFFF" letter-spacing="-0.5">NWIS Strategic &amp; Operational Impact Architecture</text>
    <text x="0" y="96" class="font-sans" font-size="15" font-weight="400" fill="#94A3B8">
      How transforming unstructured offset well archives into proactive drilling intelligence drives tangible safety, efficiency, and financial gains.
    </text>

    <!-- Hackathon Track Pill (Right) -->
    <g transform="translate(1380, 15)">
      <rect x="0" y="0" width="380" height="46" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="20" cy="23" r="5" fill="#10B981"/>
      <text x="36" y="20" class="font-mono" font-size="11" font-weight="700" fill="#E2E8F0">OIL INDIA LIMITED • SIH PS 26121</text>
      <text x="36" y="35" class="font-sans" font-size="10.5" fill="#94A3B8">Historical Offset-Well Intelligence Layer</text>
    </g>
  </g>

  <!-- ==================== CONNECTOR BRANCHES (BEZIER PATHS) ==================== -->
  <!-- Center is around (960, 530) -->
  <g fill="none">
    <!-- Branch 1 (Top Center: Hazard Awareness - Amber) -->
    <path d="M 960 450 C 960 360, 960 300, 960 250" stroke="#F59E0B" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="960" cy="250" r="5" fill="#F59E0B"/>

    <!-- Branch 2 (Top Left: Reduced Manual Searching - Cyan) -->
    <path d="M 810 490 C 650 450, 520 370, 480 340" stroke="#00E5FF" stroke-width="2.5"/>
    <circle cx="480" cy="340" r="5" fill="#00E5FF"/>

    <!-- Branch 3 (Top Right: Faster Access to Offset Exp - Blue) -->
    <path d="M 1110 490 C 1270 450, 1400 370, 1440 340" stroke="#38BDF8" stroke-width="2.5"/>
    <circle cx="1440" cy="340" r="5" fill="#38BDF8"/>

    <!-- Branch 4 (Bottom Left: Preservation of Knowledge - Green) -->
    <path d="M 810 570 C 650 610, 520 680, 480 710" stroke="#10B981" stroke-width="2.5"/>
    <circle cx="480" cy="710" r="5" fill="#10B981"/>

    <!-- Branch 5 (Bottom Right: Foundation for eRTMAC - Purple) -->
    <path d="M 1110 570 C 1270 610, 1400 680, 1440 710" stroke="#A78BFA" stroke-width="2.5" stroke-dasharray="6 4"/>
    <circle cx="1440" cy="710" r="5" fill="#A78BFA"/>
  </g>

  <!-- ==================== CENTRAL NODE: NWIS CORE ==================== -->
  <g transform="translate(800, 440)" filter="url(#centerGlow)">
    <!-- Main Outer Container -->
    <rect width="320" height="175" rx="16" fill="url(#centerGrad)" stroke="#00E5FF" stroke-width="2.5"/>

    <!-- Inner Framing -->
    <rect x="6" y="6" width="308" height="163" rx="12" fill="none" stroke="#1E3A8A" stroke-width="1.2"/>

    <!-- Central Rig Icon -->
    <g transform="translate(160, 42)">
      <circle r="22" fill="#0B132B" stroke="#00E5FF" stroke-width="1.5"/>
      <path d="M -8 10 L 0 -10 L 8 10 Z" fill="none" stroke="#00E5FF" stroke-width="1.8"/>
      <line x1="-5" y1="3" x2="5" y2="3" stroke="#00E5FF" stroke-width="1.2"/>
      <circle cx="0" cy="12" r="2.5" fill="#F59E0B"/>
    </g>

    <!-- Node Title -->
    <text x="160" y="90" class="font-sans" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">NWIS CORE</text>
    <text x="160" y="108" class="font-mono" font-size="10" font-weight="700" fill="#00E5FF" text-anchor="middle" letter-spacing="1.5">NEARBY WELLS INTELLIGENCE SYSTEM</text>

    <!-- Core description -->
    <line x1="40" y1="120" x2="280" y2="120" stroke="#1E3A8A" stroke-width="1"/>
    <text x="160" y="138" class="font-sans" font-size="11" fill="#94A3B8" text-anchor="middle">Historical Offset-Well Intelligence &amp;</text>
    <text x="160" y="152" class="font-sans" font-size="11" font-weight="600" fill="#E2E8F0" text-anchor="middle">Depth-Aware Drilling Decision Support</text>
  </g>

  <!-- ==================== BRANCH 1: EARLIER HAZARD AWARENESS (TOP CENTER) ==================== -->
  <g transform="translate(730, 135)" filter="url(#shadow8)">
    <rect width="460" height="150" rx="12" fill="url(#amberNodeGrad)" stroke="#F59E0B" stroke-width="1.8"/>
    <rect x="1" y="1" width="458" height="4" rx="2" fill="#F59E0B"/>

    <!-- Header -->
    <g transform="translate(20, 24)">
      <circle cx="10" cy="10" r="10" fill="#78350F"/>
      <text x="10" y="14" class="font-sans" font-size="12" fill="#F59E0B" text-anchor="middle">⚠️</text>
      <text x="30" y="14" class="font-sans" font-size="15" font-weight="800" fill="#FFFFFF">Earlier Awareness of Drilling Hazards</text>
      <text x="30" y="30" class="font-mono" font-size="10" font-weight="700" fill="#F59E0B">PROACTIVE +100m LOOK-AHEAD SCREENING</text>
    </g>

    <!-- Sub-bullets -->
    <g transform="translate(24, 72)">
      <text class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Dynamic Depth Projection:</tspan> Scans ahead of the active bit before penetrating hazard zones.</text>
      <text y="20" class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Cross-Well Loss/Kick Detection:</tspan> Flags severe loss zones (e.g. 3,845m in offset X12).</text>
      <text y="40" class="font-sans" font-size="11" fill="#FDE68A" font-weight="700">★ Impact: 4–8 hour operational buffer to condition mud and stage LCM.</text>
    </g>
  </g>

  <!-- ==================== BRANCH 2: REDUCED MANUAL REPORT SEARCHING (TOP LEFT) ==================== -->
  <g transform="translate(80, 230)" filter="url(#shadow8)">
    <rect width="440" height="175" rx="12" fill="url(#cyanNodeGrad)" stroke="#00E5FF" stroke-width="1.8"/>
    <rect x="1" y="1" width="438" height="4" rx="2" fill="#00E5FF"/>

    <!-- Header -->
    <g transform="translate(20, 24)">
      <circle cx="10" cy="10" r="10" fill="#0C4A6E"/>
      <text x="10" y="14" class="font-sans" font-size="12" fill="#00E5FF" text-anchor="middle">⚡</text>
      <text x="30" y="14" class="font-sans" font-size="15" font-weight="800" fill="#FFFFFF">Reduced Manual Report Searching</text>
      <text x="30" y="30" class="font-mono" font-size="10" font-weight="700" fill="#00E5FF">AUTOMATED IN-BROWSER OCR &amp; NLP</text>
    </g>

    <!-- Sub-bullets -->
    <g transform="translate(24, 72)">
      <text class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Zero Manual Archive Hunting:</tspan> Eliminates digging through scattered PDFs.</text>
      <text y="20" class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Instant Keyword &amp; Incident Extraction:</tspan> Directly parses DDR remarks &amp; WCR logs.</text>
      <text y="40" class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Verbatim Traceability:</tspan> Highlights original document paragraphs with 1-click preview.</text>
      <text y="62" class="font-sans" font-size="11" fill="#38BDF8" font-weight="700">★ Impact: Compresses 12–18 hours of manual research into &lt;30 seconds.</text>
    </g>
  </g>

  <!-- ==================== BRANCH 3: FASTER ACCESS TO OFFSET EXPERIENCE (TOP RIGHT) ==================== -->
  <g transform="translate(1400, 230)" filter="url(#shadow8)">
    <rect width="440" height="175" rx="12" fill="url(#blueNodeGrad)" stroke="#38BDF8" stroke-width="1.8"/>
    <rect x="1" y="1" width="438" height="4" rx="2" fill="#38BDF8"/>

    <!-- Header -->
    <g transform="translate(20, 24)">
      <circle cx="10" cy="10" r="10" fill="#075985"/>
      <text x="10" y="14" class="font-sans" font-size="12" fill="#38BDF8" text-anchor="middle">🎯</text>
      <text x="30" y="14" class="font-sans" font-size="15" font-weight="800" fill="#FFFFFF">Faster Access to Offset Experience</text>
      <text x="30" y="30" class="font-mono" font-size="10" font-weight="700" fill="#38BDF8">MULTI-FACTOR HEURISTIC RELEVANCE</text>
    </g>

    <!-- Sub-bullets -->
    <g transform="translate(24, 72)">
      <text class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Geospatial Haversine Radius:</tspan> Instant spatial filtering across 1–20 km radius.</text>
      <text y="20" class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Composite Score Ranking:</tspan> Ranks offsets by proximity, formation, &amp; depth.</text>
      <text y="40" class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Stratigraphic Alignment:</tspan> Auto-aligns TVD depth across regional geological dip.</text>
      <text y="62" class="font-sans" font-size="11" fill="#7DD3FC" font-weight="700">★ Impact: Immediate focus on top 3 most analogous historical boreholes.</text>
    </g>
  </g>

  <!-- ==================== BRANCH 4: PRESERVATION OF KNOWLEDGE (BOTTOM LEFT) ==================== -->
  <g transform="translate(80, 620)" filter="url(#shadow8)">
    <rect width="440" height="175" rx="12" fill="url(#greenNodeGrad)" stroke="#10B981" stroke-width="1.8"/>
    <rect x="1" y="1" width="438" height="4" rx="2" fill="#10B981"/>

    <!-- Header -->
    <g transform="translate(20, 24)">
      <circle cx="10" cy="10" r="10" fill="#064E3B"/>
      <text x="10" y="14" class="font-sans" font-size="12" fill="#10B981" text-anchor="middle">🏛️</text>
      <text x="30" y="14" class="font-sans" font-size="15" font-weight="800" fill="#FFFFFF">Institutional Knowledge Preservation</text>
      <text x="30" y="30" class="font-mono" font-size="10" font-weight="700" fill="#10B981">STRUCTURED ENTERPRISE MEMORY</text>
    </g>

    <!-- Sub-bullets -->
    <g transform="translate(24, 72)">
      <text class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Unwritten Wisdom Captured:</tspan> Indexes shift remarks and driller lessons learned.</text>
      <text y="20" class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Mitigation Precedents:</tspan> Records exactly what LCM blend or mud weight resolved kicks.</text>
      <text y="40" class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Inter-Generational Transfer:</tspan> Junior engineers instantly tap decades of field history.</text>
      <text y="62" class="font-sans" font-size="11" fill="#6EE7B7" font-weight="700">★ Impact: Safeguards OIL drilling knowledge against staff turnover &amp; retirements.</text>
    </g>
  </g>

  <!-- ==================== BRANCH 5: FOUNDATION FOR ERTMAC (BOTTOM RIGHT) ==================== -->
  <g transform="translate(1400, 620)" filter="url(#shadow8)">
    <rect width="440" height="175" rx="12" fill="url(#purpleNodeGrad)" stroke="#8B5CF6" stroke-width="1.8"/>
    <rect x="1" y="1" width="438" height="4" rx="2" fill="#8B5CF6"/>

    <!-- Header -->
    <g transform="translate(20, 24)">
      <circle cx="10" cy="10" r="10" fill="#4C1D95"/>
      <text x="10" y="14" class="font-sans" font-size="12" fill="#A78BFA" text-anchor="middle">🔗</text>
      <text x="30" y="14" class="font-sans" font-size="15" font-weight="800" fill="#FFFFFF">Foundation for eRTMAC Integration</text>
      <text x="30" y="30" class="font-mono" font-size="10" font-weight="700" fill="#A78BFA">ANTICIPATORY CONTEXT LAYER [FUTURE]</text>
    </g>

    <!-- Sub-bullets -->
    <g transform="translate(24, 72)">
      <text class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Complements Real-Time Telemetry:</tspan> Adds historical memory to live sensor feeds.</text>
      <text y="20" class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">WITSML Stream Compatibility:</tspan> Architected for WITSML 1.4/2.0 standard rig connectors.</text>
      <text y="40" class="font-sans" font-size="11" fill="#E2E8F0">• <tspan font-weight="600">Predictive Synergy:</tspan> Informs real-time anomaly alarms with offset well context.</text>
      <text y="62" class="font-sans" font-size="11" fill="#C4B5FD" font-weight="700">★ Impact: Upgrades eRTMAC from monitoring "what is happening" to "what is ahead".</text>
    </g>
  </g>

  <!-- ==================== BOTTOM EXECUTIVE ROI BAR ==================== -->
  <g transform="translate(80, 835)">
    <!-- Container -->
    <rect width="1760" height="185" rx="14" fill="#0C1527" stroke="#1E293B" stroke-width="1.5"/>

    <!-- Header inside bottom bar -->
    <g transform="translate(30, 24)">
      <rect width="240" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="12" y="16" class="font-mono" font-size="10" font-weight="700" fill="#38BDF8">SYNTHESIZED BUSINESS &amp; OPERATIONAL ROI</text>
    </g>

    <!-- 3 Metrics Columns -->
    <!-- Metric 1: NPT Avoidance -->
    <g transform="translate(30, 64)">
      <text class="font-sans" font-size="28" font-weight="900" fill="#00E5FF">₹25L – ₹1.2 Cr+</text>
      <text y="22" class="font-mono" font-size="10.5" font-weight="700" fill="#38BDF8">AVOIDED NPT COST PER INCIDENT</text>
      <text y="44" class="font-sans" font-size="12" fill="#94A3B8" width="480">
        A single stuck pipe, fishing operation, or severe mud loss incident costs days of rig downtime. NWIS look-ahead hazard warnings protect drilling economics.
      </text>
    </g>

    <line x1="590" y1="40" x2="590" y2="160" stroke="#1E293B" stroke-width="1"/>

    <!-- Metric 2: Research Efficiency -->
    <g transform="translate(630, 64)">
      <text class="font-sans" font-size="28" font-weight="900" fill="#10B981">95% Reduction</text>
      <text y="22" class="font-mono" font-size="10.5" font-weight="700" fill="#34D399">OFFSET REPORT RESEARCH DURATION</text>
      <text y="44" class="font-sans" font-size="12" fill="#94A3B8">
        Replaces 12–18 hours of manual borehole folder collation per drilling phase with instant automated OCR search, relevance ranking, and evidence citations.
      </text>
    </g>

    <line x1="1180" y1="40" x2="1180" y2="160" stroke="#1E293B" stroke-width="1"/>

    <!-- Metric 3: Rig Safety & ESG -->
    <g transform="translate(1220, 64)">
      <text class="font-sans" font-size="28" font-weight="900" fill="#F59E0B">Zero Blind Trips</text>
      <text y="22" class="font-mono" font-size="10.5" font-weight="700" fill="#FBBF24">DOWNHOLE SAFETY &amp; CREW READINESS</text>
      <text y="44" class="font-sans" font-size="12" fill="#94A3B8">
        Drilling crews never enter known regional overpressure formations or loss zones blind. Field mitigations and mud weight recipes are pre-briefed in advance.
      </text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(80, 1055)">
    <text class="font-mono" font-size="11" fill="#475569">NWIS — NEARBY WELLS INTELLIGENCE SYSTEM</text>
    <text x="1760" y="0" class="font-mono" font-size="11" fill="#475569" text-anchor="end">SIH 2026 • PROBLEM PS26121 • STRATEGIC IMPACT MIND MAP</text>
  </g>
</svg>
